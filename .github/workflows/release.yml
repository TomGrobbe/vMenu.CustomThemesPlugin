name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RESOURCE: vMenu.CustomThemesPlugin
  GITVERSION_VERSION: 6.8.2

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          dotnet tool install --global GitVersion.Tool --version "$GITVERSION_VERSION"
          export PATH="$PATH:$HOME/.dotnet/tools"

          dotnet-gitversion /output json | tee gitversion.json

          VERSION=$(jq -er '.MajorMinorPatch' gitversion.json)

          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "zip=${RESOURCE}.zip"
          } >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"

      - name: Stamp the manifest
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"

          sed -i "s/^version '[^']*'/version '$VERSION'/" fxmanifest.lua

          grep -q "^version '$VERSION'" fxmanifest.lua || {
            echo "The version line in fxmanifest.lua was not replaced."
            exit 1
          }

      # The zip holds the resource folder itself, so it unpacks straight into a resources folder.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "build/$RESOURCE"
          cp -r fxmanifest.lua client.js themes.json themes banners fonts README.md "build/$RESOURCE/"

          cd build
          zip -r "../${{ steps.version.outputs.zip }}" "$RESOURCE"
          cd ..

          unzip -l "${{ steps.version.outputs.zip }}"

      - name: Generate changelog
        shell: bash
        run: |
          LAST_TAG=$(git tag --sort=-version:refname | grep '^v' | head -n 1 || true)

          if [ -n "$LAST_TAG" ]; then
            git log "$LAST_TAG..HEAD" --pretty=format:'- `%h` (%an) %s' > changelog.txt
          else
            git log --pretty=format:'- `%h` (%an) %s' > changelog.txt
          fi

          echo "Changelog since: ${LAST_TAG:-<beginning>}"
          cat changelog.txt

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          {
            echo "Drop the \`${RESOURCE}\` folder from the zip into your server's resources, then \`ensure ${RESOURCE}\`."
            echo ""
            echo "### Changes"
            echo ""
            cat changelog.txt
          } > release_notes.md

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "vMenu Custom Themes v${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md \
            --latest \
            --target "$GITHUB_SHA" \
            "${{ steps.version.outputs.zip }}"
